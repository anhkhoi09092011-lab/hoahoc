<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Bảng tuần hoàn 3D</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="trang-auth" data-trang="dangky">
  <main class="auth-card">
    <span class="auth-tag">CHEMISTRY LAB · TÀI KHOẢN</span>
    <h1>🧪 Đăng ký</h1>
    <p class="auth-sub">Tạo tài khoản để bắt đầu hành trình chinh phục các nguyên tố.</p>

    <form id="auth-form" novalidate>
      <div class="auth-field">
        <label for="ten">Họ và tên</label>
        <input type="text" id="ten" name="ten" placeholder="Nguyễn Văn A" autocomplete="name" required>
      </div>

      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ban@example.com" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label for="matKhau">Mật khẩu</label>
        <div class="auth-pass-wrap">
          <input type="password" id="matKhau" name="matKhau" placeholder="Ít nhất 6 ký tự" autocomplete="new-password" required>
          <button type="button" class="auth-toggle" data-cho="matKhau" aria-label="Hiện mật khẩu">👁</button>
        </div>
      </div>

      <div class="auth-field">
        <label for="nhapLai">Nhập lại mật khẩu</label>
        <div class="auth-pass-wrap">
          <input type="password" id="nhapLai" name="nhapLai" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
          <button type="button" class="auth-toggle" data-cho="nhapLai" aria-label="Hiện mật khẩu">👁</button>
        </div>
      </div>

      <div id="auth-msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <button type="submit" id="auth-submit" class="auth-submit">Tạo tài khoản</button>
    </form>

    <p class="auth-switch">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></p>
    <a class="auth-back" href="index.html">← Về bảng tuần hoàn</a>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
