<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng tuần hoàn 3D</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Bảng tuần hoàn hóa học</h1>

  <input type="text" id="timKiem" placeholder="Tìm: Fe, Sắt, hoặc số 26...">

  <div id="chuThich"></div>

  <!-- 4 nút đổi kiểu sắp xếp -->
  <div id="nut">
    <button data-che="table" class="dang-chon">Table</button>
    <button data-che="sphere">Sphere</button>
    <button data-che="helix">Helix</button>
  </div>

  <div class="khung-bang">
    <div id="bang"></div>
  </div>

  <div id="thongTin">Bấm vào một nguyên tố để xem thông tin. Kéo chuột để xoay.</div>

  <script src="script.js"></script>
</body>
</html>
